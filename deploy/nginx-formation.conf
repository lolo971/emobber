# À inclure dans le bloc server { … } existant du Pi
# (par exemple /etc/nginx/sites-available/default), puis :
#   sudo nginx -t && sudo systemctl reload nginx

location /formation/ {
    alias /var/www/formation/;
    index index.html;
    # Le contenu change souvent : le navigateur revalide à chaque visite.
    add_header Cache-Control "no-cache";
}
