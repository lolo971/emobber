# Option : servir la formation sous http://<IP-du-Pi>/formation/ via Apache (serveur web du Pi).
# Prérequis : sudo a2enmod proxy proxy_http
# À inclure dans le <VirtualHost *:80> existant (après sauvegarde du fichier), puis :
#   sudo apachectl configtest && sudo systemctl reload apache2
# Le service peut alors repasser en FORMATION_HOTE=127.0.0.1.

RedirectMatch 301 ^/formation$ /formation/
ProxyPass        /formation/ http://127.0.0.1:8092/
ProxyPassReverse /formation/ http://127.0.0.1:8092/
LimitRequestBody 10485760
